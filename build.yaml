---
# Sofle clean-slate build (feat/sofle-clean): left half = BLE central with
# 5 profiles (0/1/2 = Macs, 3 = USB bridge dongle, 4 spare), right half =
# plain split peripheral. Stock ZMK status screens, full DYA stack on the
# central, Studio over USB. Deep sleep disabled everywhere (zmk#718/#2408).
# No dongle-central / ESB targets on this branch: the dongle runs the
# standalone bridge firmware (BLE HID host -> USB), not a split central.
include:
  - board: nice_nano@2.0.0/nrf52840/zmk
    shield: sofle_left
    artifact-name: sofle_left_release
    snippet: studio-rpc-usb-uart sofle-dya-central sofle-release
    cmake-args: -DCONFIG_ZMK_KEYBOARD_NAME=\"Sofle_Oled\" -DCONFIG_ZMK_IDLE_TIMEOUT=60000 -DCONFIG_ZMK_SLEEP=n -DCONFIG_ZMK_STUDIO_TRANSPORT_BLE=n -DCONFIG_BT_PERIPHERAL_PREF_MIN_INT=8 -DCONFIG_BT_PERIPHERAL_PREF_MAX_INT=24 -DCONFIG_ZMK_BEHAVIOR_OLED_TOGGLE=n
  - board: nice_nano@2.0.0/nrf52840/zmk
    shield: sofle_right
    artifact-name: sofle_right_release
    snippet: sofle-release
    cmake-args: -DCONFIG_ZMK_IDLE_TIMEOUT=60000 -DCONFIG_ZMK_SLEEP=n -DCONFIG_ZMK_BEHAVIOR_OLED_TOGGLE=n
  - board: nice_nano@2.0.0/nrf52840/zmk
    shield: sofle_left
    artifact-name: sofle_left_debug
    snippet: studio-rpc-usb-uart sofle-dya-central zmk-usb-logging sofle-debug
    cmake-args: -DCONFIG_ZMK_KEYBOARD_NAME=\"Sofle_Oled\" -DCONFIG_ZMK_IDLE_TIMEOUT=60000 -DCONFIG_ZMK_SLEEP=n -DCONFIG_ZMK_STUDIO_TRANSPORT_BLE=n -DCONFIG_BT_PERIPHERAL_PREF_MIN_INT=8 -DCONFIG_BT_PERIPHERAL_PREF_MAX_INT=24 -DCONFIG_ZMK_BEHAVIOR_OLED_TOGGLE=n
  - board: nice_nano@2.0.0/nrf52840/zmk
    shield: sofle_right
    artifact-name: sofle_right_debug
    snippet: zmk-usb-logging sofle-debug
    cmake-args: -DCONFIG_ZMK_IDLE_TIMEOUT=60000 -DCONFIG_ZMK_SLEEP=n -DCONFIG_ZMK_BEHAVIOR_OLED_TOGGLE=n
  - board: nice_nano@2.0.0/nrf52840/zmk
    shield: settings_reset
    artifact-name: settings_reset
    cmake-args: -DCONFIG_ZMK_BEHAVIOR_OLED_TOGGLE=n
