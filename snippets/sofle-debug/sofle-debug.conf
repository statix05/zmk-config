# Diagnostic build: DBG-level ZMK logging so split BLE link events are visible.
# The split link messages (Disconnected ... reason, Scanning successfully
# started, Failed to start advertising, Error notifying) are LOG_DBG in ZMK's
# split central/peripheral code — per-keystroke noise is the accepted price.
CONFIG_LOG=y
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_ZMK_LOG_LEVEL_DBG=y
CONFIG_ZMK_STUDIO_LOG_LEVEL_INF=y
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000
