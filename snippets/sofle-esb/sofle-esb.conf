# Shared ESB split transport settings for the Sofle dongle topology
# (dongle = central over USB, halves = ESB peripherals).
# Based on badjeff/zmk-feature-split-esb README (ZMK 0.4 / Zephyr 4.1 stack).
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n
CONFIG_ZMK_SPLIT_ESB=y

# All peripherals share one ESB address; each needs a distinct source id.
CONFIG_ZMK_SPLIT_ESB_PERIPHERAL_COUNT=2

# Transport tuning (module defaults, kept explicit for reproducibility)
CONFIG_ZMK_SPLIT_ESB_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_SPLIT_ESB_PROTO_TX_ACK=y
CONFIG_ZMK_SPLIT_ESB_PROTO_TX_RETRANSMIT_DELAY=600
CONFIG_ZMK_SPLIT_ESB_PROTO_TX_RETRANSMIT_COUNT=3
CONFIG_ZMK_SPLIT_ESB_RF_CH_HOP=y
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=1

# Required stack/queue sizes (module Kconfig help)
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ESB_MAX_PAYLOAD_LENGTH=48
CONFIG_ESB_TX_FIFO_SIZE=1
CONFIG_INPUT_THREAD_STACK_SIZE=4096
CONFIG_INPUT_QUEUE_MAX_MSGS=256
CONFIG_MAIN_STACK_SIZE=4096

# Battery reporting over the split link
CONFIG_ZMK_BATTERY_REPORTING=y

# No deep sleep: split wake/reconnect reliability (zmk#718/#2408)
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_TIMEOUT=60000
