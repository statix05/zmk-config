# Sofle clean-slate config (feat/sofle-clean): stock ZMK status screen,
# DYA stack, bridge HID contract. No custom screen modules, no zoom.

### Bluetooth: stronger TX + stability flags (Win11/conn-stability set)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

### Profiles: 3 Mac hosts + dongle bridge + 1 spare
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

### HID contract for the USB bridge dongle
CONFIG_ZMK_HID_REPORT_TYPE_HKRO=y
CONFIG_ZMK_HID_KEYBOARD_REPORT_SIZE=6
CONFIG_ZMK_HID_CONSUMER_REPORT_SIZE=6
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

### Key scanning: eager debouncing for lower input lag
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

### Mouse
CONFIG_ZMK_POINTING=y

### ZMK Studio (web DYA Studio over USB)
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

### Display: STOCK ZMK status screen only (battery + BT profile + layer).
### No custom screens, no display-sync, no central-owned OLED state.
CONFIG_ZMK_DISPLAY=y
CONFIG_I2C=y
CONFIG_SSD1306=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=3072
CONFIG_LV_Z_MEM_POOL_SIZE=4096
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
CONFIG_ZMK_DISPLAY_TICK_PERIOD_MS=250

### Battery: each half reports its own level over split BLE
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y

### Encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

### USB device stack kept on both halves (VBUS events; peripheral charges)
CONFIG_USB_DEVICE_STACK=y

### DYA infrastructure on both halves; RPC handlers are central-only
### (sofle-dya-central snippet)
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_TYPE_NAME_LEN=32
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=64
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_ZMK_BATTERY_HISTORY=y
CONFIG_ZMK_BATTERY_HISTORY_MAX_ENTRIES=72
CONFIG_ZMK_BATTERY_SKIP_IF_USB_POWERED=y
